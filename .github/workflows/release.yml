name: Build and release CowPlay
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cowplay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@101b3474143230c3562bd21f0b3c3f8254784571
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make check-release
      - run: make ci-web
      - name: Test browser navigation, authorization and updates
        if: matrix.arch == 'x86_64'
        env:
          CHROME_BIN: google-chrome
          LUCI_RUNTIME_DIR: target/luci-runtime
        run: make ci-browser
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/cargo/registry
            target/cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and test native Linux and OpenWrt packages
        uses: docker://rust:1.99-alpine@sha256:44819b27be4c97b0e4d7203bd2e02c4820f97700211b6a37fb4c246a2de59383
        env:
          LINUX_ARCH: ${{ matrix.arch }}
          CARGO_HOME: /github/workspace/target/cargo
          CARGO_TARGET_DIR: /github/workspace/target/linux
        with:
          entrypoint: /bin/sh
          args: -ec "apk add --no-cache make; make ci-build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cowplay-linux-${{ matrix.arch }}
          path: target/linux-dist/cowplay-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.arch == 'arm64'
        with:
          name: cowplay-apk
          path: |
            target/apk/cowplay-*.apk
            target/apk/luci-app-cowplay-*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  verify-release:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - &checkout-release
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - &download-apk
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cowplay-apk
          path: target/apk
      - &download-linux
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cowplay-linux-*
          path: target/linux-dist
          merge-multiple: true
      - run: make release-test
  release:
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'helloworlde/cowplay'
    needs: verify-release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - *checkout-release
      - *download-apk
      - *download-linux
      - name: Sign assets with the pinned production key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.COWPLAY_RELEASE_SIGNING_KEY }}
          EXPECTED_PUBLIC_KEY_SHA256: ${{ vars.COWPLAY_RELEASE_PUBLIC_KEY_SHA256 }}
        run: make release-sign
      - name: Upload, verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-publish
