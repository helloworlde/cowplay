name: Build and release CowPlay
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cowplay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  openwrt:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@101b3474143230c3562bd21f0b3c3f8254784571
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate version and release policy
        shell: bash
        run: |
          make check-version
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('packaging/release-policy.json').read_text())
          assert p['repository'] == 'helloworlde/cowplay'
          assert p['openwrt_releases'] and p['upgrade_from']
          PY
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            version=$(sed -n 's/.*--info version:\([^ ]*\).*/\1/p' scripts/build-apk.sh)
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - name: Build static ARM64 core and noarch LuCI packages
        run: |
          npm ci --prefix web
          make build
      - name: Run Rust, package lifecycle and real signed APK tests
        run: |
          docker run --rm --platform linux/arm64 -v "$GITHUB_WORKSPACE:/src" -w /src \
            -v cowplay-cargo-registry:/usr/local/cargo/registry \
            -e CARGO_TARGET_DIR=/src/target/alpine rust:1.99-alpine sh -ec '
              apk add --no-cache musl-dev openssl python3 >/dev/null
              cargo test --workspace --locked
              python3 scripts/test-package-lifecycle.py
              python3 scripts/test-sysupgrade-restore.py
              python3 scripts/test-release-artifacts.py
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cowplay-apk
          path: target/apk/*.apk
          if-no-files-found: error
          retention-days: 7
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@101b3474143230c3562bd21f0b3c3f8254784571
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded web UI
        run: |
          make check-version
          npm ci --prefix web
          npm run build --prefix web
      - name: Build and test native static Linux release
        env:
          LINUX_ARCH: ${{ matrix.arch }}
          LINUX_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$LINUX_PLATFORM" -v "$GITHUB_WORKSPACE:/src" -w /src \
            -v cowplay-cargo-registry:/usr/local/cargo/registry \
            -e CARGO_TARGET_DIR=/src/target/linux -e LINUX_ARCH rust:1.99-alpine sh -ec '
              apk add --no-cache musl-dev openssl python3 coreutils util-linux curl >/dev/null
              cargo build --locked --release
              cargo test --workspace --locked
              version=$(sed -n "s/.*--info version:\([^ ]*\).*/\1/p" scripts/build-apk.sh)
              python3 scripts/build-linux-tar.py target/linux/release/cowplay "$LINUX_ARCH" "target/linux-dist/cowplay-$version-linux-$LINUX_ARCH.tar.gz"
              python3 scripts/test-linux-install.py
              python3 scripts/test-linux-download.py
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cowplay-linux-${{ matrix.arch }}
          path: target/linux-dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'helloworlde/cowplay'
    needs: [openwrt, linux]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cowplay-apk
          path: target/apk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cowplay-linux-x86_64
          path: target/linux-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cowplay-linux-arm64
          path: target/linux-dist
      - name: Prepare signing tool
        run: |
          docker pull rust:1.99-alpine
          cat > "$RUNNER_TEMP/apk" <<'SH'
          #!/bin/sh
          exec docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -w "$GITHUB_WORKSPACE" rust:1.99-alpine apk "$@"
          SH
          chmod 700 "$RUNNER_TEMP/apk"
      - name: Sign packages and manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.COWPLAY_RELEASE_SIGNING_KEY }}
          EXPECTED_PUBLIC_KEY_SHA256: ${{ vars.COWPLAY_RELEASE_PUBLIC_KEY_SHA256 }}
          TMPDIR: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/cowplay-release.key"
          trap 'rm -f "$key"' EXIT
          test -n "$RELEASE_SIGNING_KEY"
          test -n "$EXPECTED_PUBLIC_KEY_SHA256"
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          unset RELEASE_SIGNING_KEY
          actual=$(openssl pkey -in "$key" -pubout | sha256sum | cut -d ' ' -f 1)
          test "$actual" = "$EXPECTED_PUBLIC_KEY_SHA256"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p = json.loads(Path('packaging/release-policy.json').read_text())
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          args = ['python3', 'scripts/prepare-github-release.py', '--repository', p['repository'],
                  '--core', f'target/apk/cowplay-{version}.apk', '--luci', f'target/apk/luci-app-cowplay-{version}.apk',
                  '--sign-key', os.environ['RUNNER_TEMP'] + '/cowplay-release.key',
                  '--output', 'target/release-assets', '--apk', os.environ['RUNNER_TEMP'] + '/apk',
                  '--linux-x86_64', f'target/linux-dist/cowplay-{version}-linux-x86_64.tar.gz',
                  '--linux-arm64', f'target/linux-dist/cowplay-{version}-linux-arm64.tar.gz']
          for value in p['openwrt_releases']: args += ['--openwrt-release', value]
          for value in p['upgrade_from']: args += ['--upgrade-from', value]
          subprocess.run(args, check=True)
          PY
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --generate-notes \
            target/release-assets/*.apk target/release-assets/cowplay-release.json \
            target/release-assets/cowplay-release.sig target/release-assets/release-key.pem \
            target/release-assets/*.tar.gz target/release-assets/SHA256SUMS \
            target/release-assets/SHA256SUMS.sig target/release-assets/install-linux-from-github.sh
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
