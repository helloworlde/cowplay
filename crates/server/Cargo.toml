[package]
name = "f50-server"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
f50-core = {path="../core"}
axum = {version="=0.8.4", features=["ws"]}
axum-server = {version="=0.8.0", features=["tls-rustls-no-provider"]}
tokio = {version="=1.47.1", features=["rt-multi-thread","net","sync","time","macros","signal"]}
serde = {version="=1.0.228",features=["derive"]}
serde_json = "=1.0.145"
subtle = "=2.6.1"
include_dir = "=0.7.4"
zeroize = "=1.8.2"
mdns-sd = "=0.21.7"
rustls = {version="=0.23.46",default-features=false,features=["ring","std","tls12"]}
[dev-dependencies]
rcgen = {version="=0.14.10",default-features=false,features=["pem","ring"]}
tokio-rustls = {version="=0.26.6",default-features=false,features=["ring","tls12"]}
tokio = {version="=1.47.1",features=["test-util"]}
tower = {version="=0.5.2",features=["util"]}
tokio-tungstenite = "=0.26.2"
futures-util = "=0.3.31"
