[package]
name = "f50-core"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
chacha20poly1305 = "=0.10.1"
hkdf = "=0.12.4"
sha2 = "=0.10.9"
x25519-dalek = {version="=2.0.1", features=["static_secrets"]}
ed25519-dalek = "=2.2.0"
zeroize = "=1.8.2"
serde = {version="=1.0.228", features=["derive"]}
rand_core = {version="=0.6.4",features=["getrandom"]}
num-bigint = "=0.4.6"
subtle = "=2.6.1"
aes = "=0.8.4"
ctr = "=0.9.2"
sha1 = "=0.10.6"
p256 = {version="=0.13.2",features=["pkcs8","ecdsa","ecdh"]}
ring = "=0.17.14"
cms = "=0.2.3"
x509-cert = "=0.2.5"
der = {version="=0.7.10",features=["alloc"]}
plist = {version="=1.8.0",features=["enable_unstable_features_that_may_break_with_minor_version_bumps"]}
