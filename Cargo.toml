[workspace]
members = [".", "crates/core", "crates/server"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
[package]
name = "cowplay"
version = "0.0.2"
edition = "2024"
license = "GPL-3.0-only"
[features]
default = ["tesla"]
tesla = ["f50-core/tesla"]

[[example]]
name = "tesla-ble-scan"
required-features = ["tesla"]

[dependencies]
f50-core = {path="crates/core",default-features=false}
f50-server = {path="crates/server"}
tokio = {version="=1.47.1",features=["rt-multi-thread","net","sync","time","macros","signal","process","io-util"]}
serde = {version="=1.0.228",features=["derive"]}
serde_json = "=1.0.145"
axum = "=0.8.4"
zbus = {version="=5.19.0",default-features=false,features=["tokio"]}
libc = "=0.2.191"
sha2 = "=0.10.9"
zeroize = "=1.8.2"
# Reuse maintained protocol and certificate implementations.
reqwest = {version="=0.12.28",default-features=false,features=["rustls-tls-manual-roots"]}
instant-acme = {version="=0.8.5",default-features=false,features=["ring","rcgen"]}
http-body-util = "=0.1.3"
x509-cert = {version="=0.2.5",features=["pem"]}
der = "=0.7.10"
tempfile = "=3.27.0"
rustls = {version="=0.23.46",default-features=false,features=["ring","std","tls12"]}
rustls-pki-types = {version="=1.15.1",features=["std"]}
[dev-dependencies]
rcgen = {version="=0.14.10",default-features=false,features=["pem","ring"]}
zbus = {version="=5.19.0",default-features=false,features=["tokio","bus-impl"]}

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
